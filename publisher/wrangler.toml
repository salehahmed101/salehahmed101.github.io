name = "saleh-portfolio-publisher"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[build]
command = "node prepare-assets.mjs"

[assets]
directory = ".wrangler/portfolio-assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
APP_ORIGIN = ""
GITHUB_CLIENT_ID = ""

[observability]
enabled = false
